name: autorelease
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  autorelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Install
        run: mise run install

      - name: Codegen
        run: mise run codegen

      - name: PR if Difference
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: update codegen"
          commit-message: "chore: update codegen"
          branch: "chore/update-codegen"
          delete-branch: true
          base: ${{ github.head_ref || github.ref_name }}

      - name: Stop if PR created
        if: steps.cpr.outputs.pull-request-number != ''
        run: exit 1

      - name: CI
        run: mise run ci

      - name: Release (Conditional)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --generate-notes || true

      - name: Artifacts (Conditional)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: .
